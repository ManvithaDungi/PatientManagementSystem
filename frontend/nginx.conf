# HSTS is only meaningful (and only safe) over TLS: emit it when this hop is TLS ($scheme) or when a
# TLS-terminating proxy in front of us says so (X-Forwarded-Proto).
map "$scheme:$http_x_forwarded_proto" $hsts_header {
    default                  "";
    "https:"                 "max-age=31536000; includeSubDomains";
    "~^[a-z]+:https$"        "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;   # matches the backend's file-upload limit

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: same origin as the SPA, so the SameSite=Strict refresh cookie works
    # and no CORS preflight is needed.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # never trust a client-supplied value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets are immutable
    location /static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys are picked up
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths fall back to the SPA shell
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
