name: Deploy

# Runs only after the CI workflow has succeeded on main. Nothing is deployed from a failed build.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Host, user and key come from repository/environment secrets; nothing is hard-coded here.
      # Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY. Optional: DEPLOY_PATH (default ~/PatientManagementSystem).
      - name: Deploy over SSH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            cd "${DEPLOY_PATH:-$HOME/PatientManagementSystem}"
            git fetch origin main
            git checkout main
            git merge --ff-only "${{ github.event.workflow_run.head_sha }}"
            # The whole stack (including the nginx-served frontend on port 3000) comes from Compose v2.
            docker compose pull --ignore-buildable
            docker compose up -d --build --remove-orphans
            docker compose ps
