name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Includes the Testcontainers test that runs every Flyway migration on PostgreSQL 16
      # (the runner has Docker), then boots Hibernate with ddl-auto=validate.
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify
        working-directory: backend

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend/app

      - name: Unit tests
        run: npm test -- --watchAll=false
        working-directory: frontend/app
        env:
          CI: true

      - name: Production build
        run: npm run build
        working-directory: frontend/app
        env:
          CI: true
          GENERATE_SOURCEMAP: 'false'

  docker:
    name: Docker images and Compose config
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build backend image
        run: docker build -f backend/Dockerfile backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend
