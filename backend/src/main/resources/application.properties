spring.application.name=backend
# Database Configuration
# We use environment variables so this works in Docker AND locally
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthcare_auth_db?stringtype=unspecified}
# No default password: the application refuses to start without SPRING_DATASOURCE_PASSWORD.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only
# verifies that entities and tables agree, and fails fast on drift.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Sessions are not kept open during view rendering: every response is built from DTOs inside a service transaction.
spring.jpa.open-in-view=false
# -------------------------
# APPLICATION LOGGING
# -------------------------

# Root log level
logging.level.root=INFO

# Log API requests (Spring Web)
logging.level.org.springframework.web=INFO

# Log Hibernate SQL queries (better way than show-sql)
# Statement and bind-parameter logging would write patient data and credential
# hashes to disk, so it is off unless explicitly raised for local debugging.
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:WARN}

# Write logs to file
logging.file.name=logs/backend.log

# Log pattern (clean readable format)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} - %level - %msg%n
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# For sending otp through mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Base64, >= 32 bytes. No default: generate with `openssl rand -base64 48`.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000 
# 900000 ms = 15 minutes

# Frontend URL for password reset links
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
server.port=${SERVER_PORT:8080}
# Behind the nginx proxy: take the client address from X-Forwarded-For (Tomcat only
# honours it from private/loopback proxies), so rate limiting and audit see real IPs.
server.forward-headers-strategy=native

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Refresh-token cookie: must be true whenever the app is served over HTTPS (i.e. any real deployment)
app.cookie.secure=${COOKIE_SECURE:false}

spring.mail.properties.mail.smtp.ssl.trust=*


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Required by the Compose Redis service (REDIS_PASSWORD); empty means no AUTH (local development only).
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
# If using Docker networking, use the container name:
# spring.data.redis.host=redis

logging.level.org.springframework.security=INFO

# -------------------------
# ACTUATOR + PROMETHEUS
# -------------------------

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
# Liveness/readiness probes. Redis is deliberately NOT part of health: if it is down, sign-in fails closed but the
# process is still alive (see README). Redis status is reported by /api/admin/system-health.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.redis.enabled=false
# An unreachable SMTP relay must not make the whole application report DOWN.
management.health.mail.enabled=false
# A failed nightly backup shows up as DEGRADED (HTTP 200) rather than taking the service out of rotation.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UNKNOWN,UP
management.endpoint.health.status.http-mapping.DEGRADED=200

management.endpoint.prometheus.enabled=true
management.endpoint.prometheus.cache.time-to-live=0

server.tomcat.relaxed-path-chars=_
server.tomcat.relaxed-query-chars=_

# -------------------------
# NEW FEATURES CONFIGURATION
# -------------------------

# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AES-256 Encryption Key
# Base64 of exactly 32 bytes. No default: generate with `openssl rand -base64 32`.
app.encryption.key=${APP_ENCRYPTION_KEY}

# Database Backup Configuration
backup.enabled=${BACKUP_ENABLED:true}
backup.cron=${BACKUP_CRON:0 0 2 * * *}
backup.directory=${BACKUP_DIR:./backups}
backup.retention-days=${BACKUP_RETENTION:7}

# Data Archival Configuration
archival.enabled=${ARCHIVAL_ENABLED:true}
archival.cron=${ARCHIVAL_CRON:0 0 3 * * SUN}
archival.inactivity-days=${ARCHIVAL_INACTIVITY_DAYS:365}

# First-run administrator. Created only when no ADMIN exists AND both values are
# set; there is no default password. Unset APP_ADMIN_PASSWORD after first start.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Startup secret validation (see StartupSecretsValidator). Leave true outside tests.
app.secrets.enforce=${APP_SECRETS_ENFORCE:true}